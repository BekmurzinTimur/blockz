<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e1ddd1"/><stop offset="1" stop-color="#eae6dd"/></linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2c4b2"/><stop offset=".45" stop-color="#c99a7e"/><stop offset="1" stop-color="#ba8e74"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b6c4b1"/><stop offset=".45" stop-color="#839a7c"/><stop offset="1" stop-color="#788e72"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6d6b2"/><stop offset=".45" stop-color="#d1b375"/><stop offset="1" stop-color="#c0a56c"/></linearGradient>
